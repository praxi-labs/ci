name: Python

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test against.
        type: string
        default: '["3.10", "3.11", "3.12", "3.13"]'
      runners:
        description: JSON array of runner labels to test on.
        type: string
        default: '["ubuntu-latest"]'
      working-directory:
        description: Directory holding pyproject.toml.
        type: string
        default: '.'
      primary-python-version:
        description: Version used for the single-run lint and build jobs.
        type: string
        default: '3.12'
      dev-extra:
        description: Optional dependency group installed for the test run.
        type: string
        default: dev
      upload-distributions:
        description: Upload the built sdist and wheel as build artifacts.
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 15

permissions: {}

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
        os: ${{ fromJSON(inputs.runners) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[${{ inputs.dev-extra }}]"

      - name: Test
        run: python -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.primary-python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[${{ inputs.dev-extra }}]"

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.primary-python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: List distribution contents
        run: |
          for archive in dist/*.tar.gz; do tar -tzf "$archive" | sort; done
          for wheel in dist/*.whl; do python -m zipfile -l "$wheel"; done

      - name: Upload distributions
        if: inputs.upload-distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: ${{ inputs.working-directory }}/dist/*
          retention-days: 7
          if-no-files-found: error
